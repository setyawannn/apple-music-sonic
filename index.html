<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Music</title>
  <link rel="stylesheet" href="src/styles/app.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <svg class="apple-logo" viewBox="0 0 24 24" width="28" height="28">
          <path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.13 0-1.31.62-2 .3-2.77-.4C3.86 15.77 4.5 8.72 8.96 8.26c1.22-.11 2.08.67 3.13.67 1.04 0 1.68-.67 3.13-.67 1.07-.01 2.1.49 2.8 1.24-2.67 1.84-2.2 5.72.39 6.69-.43 1.12-.98 2.22-1.77 3.09h.01zM12.02 8.16c-.22-2.66 2-4.9 4.16-5.16.36 2.92-2.2 5.18-4.16 5.16z"/>
        </svg>
        <h1 class="app-title">Music</h1>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="listen-now">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
          <span>Listen Now</span>
        </a>
        <a class="nav-item" data-view="browse">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span>Browse</span>
        </a>
        <a class="nav-item" data-view="radio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.9 2 2 2h16c1.11 0 2-.9 2-2V8c0-1.1-.9-2-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-2v-2h-2v2H4V8h16v4z"/></svg>
          <span>Radio</span>
        </a>
      </nav>

      <div class="sidebar-section-label">Library</div>
      <nav class="sidebar-nav library-nav">
        <a class="nav-item" data-view="library">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <span>Library</span>
          <span class="nav-badge" id="track-count">0</span>
        </a>
        <a class="nav-item" data-view="playlists">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
          <span>Playlists</span>
        </a>
        <a class="nav-item" data-view="albums">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
          <span>Albums</span>
        </a>
        <a class="nav-item" data-view="artists">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span>Artists</span>
        </a>
      </nav>

      <div class="sidebar-section-label">Playlists</div>
      <div class="playlist-list" id="playlist-list">
        <div class="playlist-item">Liked Songs</div>
        <div class="playlist-item create-playlist" id="create-playlist">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>New Playlist</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="content">
      <header id="topbar">
        <div class="topbar-left">
          <button class="nav-btn" id="nav-back">‹</button>
          <button class="nav-btn" id="nav-forward">›</button>
        </div>
        <div class="topbar-center">
          <div class="search-container">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search-input" placeholder="Search Apple Music or Library" autocomplete="off" />
            <div class="search-suggestions-dropdown" id="search-suggestions"></div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="sign-in-btn" id="auth-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span id="auth-label">Sign In</span>
          </button>
          <button class="settings-btn" id="settings-btn" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
        </div>
      </header>

      <section id="main-view" class="view">
        <!-- Dynamic content rendered by JS -->
      </section>
    </main>

    <!-- Playback Bar -->
    <footer id="playback-bar">
      <div class="now-playing">
        <div class="now-playing-art" id="now-playing-art">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="#333">
            <rect width="56" height="56" rx="4" fill="#2a2a2a"/>
            <path d="M28 18c-5.52 0-10 4.48-10 10s4.48 10 10 10 10-4.48 10-10-4.48-10-10-10zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5s2.01-4.5 4.5-4.5 4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5z" fill="#555"/>
          </svg>
        </div>
        <div class="now-playing-info">
          <div class="track-name" id="now-playing-title">No Track Selected</div>
          <div class="artist-name" id="now-playing-artist">Open your library to start playing</div>
          <div id="now-playing-badge" style="display: none; margin-top: 2px;">
            <span class="quality-badge quality-lossless" id="quality-indicator">Apple Music</span>
          </div>
        </div>
        <button class="like-btn" id="like-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
      </div>

      <div class="playback-controls">
        <button class="control-btn" id="shuffle-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="control-btn" id="prev-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn play-btn" id="play-btn" title="Play / Pause (Space)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path id="play-icon" d="M8 5v14l11-7z"/>
          </svg>
          <span class="play-spinner" id="play-spinner" aria-hidden="true"></span>
        </button>
        <button class="control-btn" id="next-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="control-btn" id="repeat-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>

      <div class="playback-progress">
        <span class="time current-time" id="current-time">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
          <div class="progress-handle" id="progress-handle"></div>
        </div>
        <span class="time total-time" id="total-time">0:00</span>
        <button class="volume-btn" id="volume-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <div class="volume-slider">
          <div class="progress-bar volume-bar" id="volume-bar">
            <div class="progress-fill" id="volume-fill" style="width: 80%"></div>
            <div class="progress-handle" id="volume-handle"></div>
          </div>
        </div>
        <button class="control-btn queue-btn" id="queue-btn" title="Up Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h11v2H4V6zm0 5h11v2H4v-2zm0 5h7v2H4v-2zm12-9.5l4.5 3.5-4.5 3.5v-7z"/></svg>
          <span class="queue-count" id="queue-count" style="display: none;"></span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Up Next queue drawer -->
  <aside id="queue-drawer" class="queue-drawer" aria-hidden="true">
    <div class="queue-drawer-header">
      <span>Up Next</span>
      <button class="modal-close" id="queue-close-btn">&times;</button>
    </div>
    <div class="queue-drawer-body" id="queue-drawer-body"></div>
  </aside>

  <!-- Transient messages (playback errors, notices) -->
  <div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>

  <!-- Sign In / Account Modal -->
  <div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-auth-title">Apple ID Account</div>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-auth-body">
        <!-- Injected dynamically by JS -->
      </div>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
